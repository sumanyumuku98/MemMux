name: Docs

# Builds the complete project documentation site and publishes it to GitHub Pages on every push
# to main. The site is an Astro Starlight build of the guides in website/, with the generated
# rustdoc API reference nested under /api/.
# Requires Pages to be enabled once in repo Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build the guide (Astro Starlight)
        working-directory: website
        run: |
          npm ci
          npm run build

      - name: Build the API reference (rustdoc)
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Assemble the site
        run: |
          rm -rf site
          cp -r website/dist site
          # Nest the rustdoc API reference under /api/.
          cp -r target/doc site/api
          # Redirect bare /api to the daemon crate docs.
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=memmuxd/index.html">\n' > site/api/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
