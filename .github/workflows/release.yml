name: Release

# Tag-triggered release pipeline (SUM-25): builds per-target archives, a curl installer, and a
# Homebrew formula, then publishes a GitHub Release. macOS code-signing/notarization (SUM-26)
# runs only when the Apple secrets are configured; otherwise it is skipped.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # SUM-26: signing/notarization engages only when these repo secrets exist.
  HAS_APPLE_CREDS: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_NOTARY_KEY != '' }}
  # Homebrew tap auto-publish engages only when a push token to the tap repo is configured.
  HAS_TAP: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          # Intel macOS is cross-compiled on the arm64 runner (Apple clang emits x86_64), so the
          # release does not depend on the scarce/retired macos-13 Intel runners.
          - { os: macos-latest, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        run: cargo build --release --locked --target ${{ matrix.target }} -p memmux -p memmuxd
      - name: Sign + notarize (macOS, only if Apple secrets are set — SUM-26)
        if: runner.os == 'macOS' && env.HAS_APPLE_CREDS == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TARGET: ${{ matrix.target }}
        run: bash scripts/macos-notarize.sh "target/${TARGET}/release/memmux" "target/${TARGET}/release/memmuxd"
      - name: Package archive
        shell: bash
        run: bash scripts/package.sh "${{ github.ref_name }}" "${{ matrix.target }}"
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            memmux-*.tar.gz
            memmux-*.tar.gz.sha256

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate installer + Homebrew formula
        shell: bash
        run: bash scripts/gen-release-assets.sh "${{ github.ref_name }}" dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pre-1.0 tags (v0.*) are published as pre-releases; v1.0.0+ are stable.
          case "${{ github.ref_name }}" in
            v0.*) prerelease="--prerelease" ;;
            *)    prerelease="" ;;
          esac
          gh release create "${{ github.ref_name }}" \
            dist/*.tar.gz dist/*.sha256 dist/install.sh dist/memmux.rb \
            --title "MemMux ${{ github.ref_name }}" \
            --generate-notes $prerelease
      - name: Publish formula to Homebrew tap (only if HOMEBREW_TAP_TOKEN is set)
        if: env.HAS_TAP == 'true'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPO: sumanyumuku98/homebrew-tap
          VERSION: ${{ github.ref_name }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          mkdir -p tap/Formula
          cp dist/memmux.rb tap/Formula/memmux.rb
          cd tap
          git config user.name "memmux-release-bot"
          git config user.email "memmux-release-bot@users.noreply.github.com"
          git add Formula/memmux.rb
          if git diff --cached --quiet; then
            echo "formula unchanged; nothing to publish"
          else
            git commit -m "memmux ${VERSION}"
            git push
          fi
