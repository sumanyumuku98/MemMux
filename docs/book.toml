[book]
title = "MemMux"
description = "The memory-aware local runtime for parallel AI coding agents."
authors = ["Sumanyu Muku"]
src = "."
language = "en"

[build]
# Build outside the source tree (docs/) so the output is never treated as a chapter.
build-dir = "../target/mdbook"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/sumanyumuku98/MemMux"
edit-url-template = "https://github.com/sumanyumuku98/MemMux/edit/main/docs/{path}"
site-url = "/"

[output.html.fold]
enable = true
level = 1
