[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.5.2"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/sumanyumuku98/MemMux"
homepage = "https://github.com/sumanyumuku98/MemMux"
authors = ["Sumanyu Muku"]
description = "MemMux — the memory-aware local runtime for parallel AI coding agents."

[workspace.dependencies]
# Internal crates
memmux-core = { path = "crates/memmux-core", version = "0.5.2" }
memmux-metrics = { path = "crates/memmux-metrics", version = "0.5.2" }
memmux-proto = { path = "crates/memmux-proto", version = "0.5.2" }
memmux-sched = { path = "crates/memmux-sched", version = "0.5.2" }
memmux-pty = { path = "crates/memmux-pty", version = "0.5.2" }
memmux-worktree = { path = "crates/memmux-worktree", version = "0.5.2" }
memmux-store = { path = "crates/memmux-store", version = "0.5.2" }
memmux-adapters = { path = "crates/memmux-adapters", version = "0.5.2" }
memmux-lifecycle = { path = "crates/memmux-lifecycle", version = "0.5.2" }

# External (all pinned to mature, long-published minor lines; see ORG dependency policy)
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# toml 0.8 (2023) — user config file parsing (SUM-133); well over 7 days old.
toml = "0.8"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time", "process", "signal"] }
# NOTE (org dependency policy): versions pinned to releases published > 7 days ago.
# `tracing-subscriber` deliberately omits the `env-filter` feature so we don't pull the
# regex/aho-corasick stack (several of whose releases are < 7 days old).
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "=4.6.4", features = ["derive"] }
libc = "0.2"
ratatui = "0.28"
crossterm = "0.28"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
